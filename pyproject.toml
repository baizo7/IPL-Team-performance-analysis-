[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ipl-performance-analysis"
version = "2.0.0"
description = "IPL Performance Analysis & 3D Ball Tracking Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.30.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.15.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "altair>=5.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.24.0"
]
