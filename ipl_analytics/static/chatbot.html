<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        html, body { background: transparent; width: 100%; height: 100%; overflow: hidden; position: relative; }
        
        /* Floating Action Button (FAB) */
        .fab-btn {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }
        .fab-btn:hover {
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 12px 30px rgba(56, 189, 248, 0.7);
        }
        .fab-icon {
            font-size: 26px;
            user-select: none;
        }

        /* Chat Window Container */
        .chat-window {
            position: absolute;
            bottom: 70px;
            right: 5px;
            width: 360px;
            height: 500px;
            background: rgba(11, 15, 26, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            pointer-events: none;
            z-index: 999;
        }
        .chat-window.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        /* Header (Draggable Handle) */
        .chat-header {
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
            user-select: none;
        }
        .chat-header:active {
            cursor: grabbing;
        }
        .chat-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .icon-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .icon-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
        }

        /* Settings Panel */
        .settings-panel {
            display: none;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            font-size: 11px;
        }
        .settings-panel.active {
            display: block;
        }
        .settings-label {
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .settings-input {
            width: 100%;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: #f8fafc;
            font-size: 11px;
            margin-bottom: 8px;
        }

        /* Message Log */
        .messages-container {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scrollbar-width: thin;
            scrollbar-color: rgba(56, 189, 248, 0.3) transparent;
        }
        .msg {
            max-width: 88%;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 11.5px;
            line-height: 1.45;
            word-wrap: break-word;
        }
        .msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(129, 140, 248, 0.2));
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #f8fafc;
            border-bottom-right-radius: 2px;
        }
        .msg.assistant {
            align-self: flex-start;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border-bottom-left-radius: 2px;
        }

        /* Suggestion Chips */
        .chips-container {
            display: flex;
            gap: 6px;
            padding: 6px 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .chip {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: #38bdf8;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 9.5px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip:hover {
            background: rgba(56, 189, 248, 0.25);
            transform: translateY(-1px);
        }

        /* Input Area */
        .input-container {
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            gap: 6px;
        }
        .chat-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 8px 10px;
            color: #ffffff;
            font-size: 11.5px;
            outline: none;
        }
        .chat-input:focus {
            border-color: #38bdf8;
        }
        .send-btn {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border: none;
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 11px;
            transition: all 0.2s;
        }
        .send-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="fab-btn" id="fab-btn" title="Open AI Analyst Chatbot">
        <span class="fab-icon" id="fab-icon">🤖</span>
    </div>

    <div class="chat-window" id="chat-window">
        <div class="chat-header" id="chat-header" title="Drag to move chat window">
            <div class="chat-title">🤖 IPL AI Analyst</div>
            <div class="header-actions">
                <button class="icon-btn" id="settings-toggle-btn" title="Settings">⚙️</button>
                <button class="icon-btn" id="close-btn" title="Close">✕</button>
            </div>
        </div>

        <div class="settings-panel" id="settings-panel">
            <div class="settings-label">Gemini API Key</div>
            <input type="password" id="api-key-input" class="settings-input" placeholder="Paste AIZaSy... key here" value="{{DEFAULT_KEY}}">
            
            <div class="settings-label">Model Engine</div>
            <select id="model-select" class="settings-input">
                <option value="gemini-3.1-flash-lite" selected>gemini-3.1-flash-lite</option>
                <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
            </select>
        </div>

        <div class="messages-container" id="messages-container">
            <div class="msg assistant">
                Hi! I am your IPL Performance Intelligence Assistant. Ask me anything about pitch maps, wagon wheels, phase stats, player impact ratings, or bowling lengths!
            </div>
        </div>

        <div class="chips-container">
            <div class="chip" onclick="sendQuickPrompt('Explain the 3D Pitch Zones')">🎯 Pitch Zones</div>
            <div class="chip" onclick="sendQuickPrompt('How does Phase Analysis work?')">📊 Phase Analysis</div>
            <div class="chip" onclick="sendQuickPrompt('What is Player Impact Rating?')">⭐ Impact Rating</div>
        </div>

        <div class="input-container">
            <input type="text" class="chat-input" id="chat-input" placeholder="Ask about modules or cricket stats..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="chatbot.js"></script>
    <script>
        // Initialize with runtime data
        window.CHATBOT_CONFIG = {
            defaultKey: "{{DEFAULT_KEY}}",
            team1: "{{TEAM1}}",
            team2: "{{TEAM2}}",
            t1_runs: {{T1_RUNS}},
            t1_balls: {{T1_BALLS}},
            t1_rr: {{T1_RR}},
            t1_fours: {{T1_FOURS}},
            t1_sixes: {{T1_SIXES}},
            t1_wickets: {{T1_WICKETS}},
            t1_dot_pct: {{T1_DOT_PCT}},
            t1_top_name: "{{T1_TOP_NAME}}",
            t1_top_runs: {{T1_TOP_RUNS}},
            t2_runs: {{T2_RUNS}},
            t2_balls: {{T2_BALLS}},
            t2_rr: {{T2_RR}},
            t2_fours: {{T2_FOURS}},
            t2_sixes: {{T2_SIXES}},
            t2_wickets: {{T2_WICKETS}},
            t2_dot_pct: {{T2_DOT_PCT}},
            t2_top_name: "{{T2_TOP_NAME}}",
            t2_top_runs: {{T2_TOP_RUNS}}
        };
    </script>
</body>
</html>
